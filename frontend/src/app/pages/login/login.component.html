<section class="auth-layout">
  <figure class="hero-card">
    <img src="images/hero-puja.jpg" alt="A brass kalash, marigold flowers, and a lit diya prepared for a home puja">
    <figcaption>
      <p class="eyebrow">At your home</p>
      <h1>A pandit for the puja you need</h1>
      <p>Choose the ritual, see every ingredient, and book the hours. The pandit sees the time and the address.</p>
    </figcaption>
  </figure>

  <div>
    <p class="eyebrow">Family and pandit</p>
    <h2>Sign in</h2>
    <p class="lede">Book a pandit for a puja, or open your visit schedule.</p>

    <form class="card stack" (ngSubmit)="submit()">
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" autocomplete="username" required />
      </label>
      <label>
        Password
        <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
      </label>
      @if (error) {
        <p class="form-error">{{ error }}</p>
      }
      <button class="primary" type="submit" [disabled]="busy">{{ busy ? "Signing in…" : "Sign in" }}</button>
    </form>

    <div class="demo">
      <p>Try a sample account. Password is password123.</p>
      <button type="button" class="ghost" (click)="fill('family@bookpandit.local')">Anita, family</button>
      <button type="button" class="ghost" (click)="fill('raghunath@bookpandit.local')">Raghunath, pandit</button>
    </div>

    <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</section>
